<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #7bd3ff 0%, #dff6ff 100%);
        color: #0f1c2e;
      }

      #game-wrapper {
        width: min(90vw, 420px);
        text-align: center;
      }

      #hud {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-weight: 600;
      }

      #canvas-wrap {
        position: relative;
      }

      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 18px;
        background: #86e1ff;
        box-shadow: 0 20px 45px rgba(15, 28, 46, 0.25);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: rgba(15, 28, 46, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .overlay-card {
        background: rgba(255, 255, 255, 0.92);
        padding: 20px 24px;
        border-radius: 16px;
        max-width: 260px;
        box-shadow: 0 12px 24px rgba(15, 28, 46, 0.3);
      }

      .overlay-card h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      .overlay-card p {
        margin: 0 0 16px;
        font-size: 0.95rem;
        color: #24324d;
      }

      .overlay-card button {
        border: none;
        background: #ff9f1c;
        color: #fff;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .overlay-card button:hover,
      .overlay-card button:focus {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(255, 159, 28, 0.45);
        outline: none;
      }

      .instructions {
        margin-top: 12px;
        font-size: 0.85rem;
        color: #23344f;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
      </div>
      <div id="canvas-wrap">
        <canvas id="game" width="360" height="640" aria-label="Flappy Bird game"></canvas>
        <div id="overlay" class="overlay show">
          <div class="overlay-card">
            <h1 id="overlay-title">Flappy Bird</h1>
            <p id="overlay-message">Press Space or tap to start.</p>
            <button id="play-btn" type="button">Start</button>
          </div>
        </div>
      </div>
      <p class="instructions">Controls: Space / Click / Tap to flap · R to restart</p>
    </div>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMessage = document.getElementById("overlay-message");
      const playButton = document.getElementById("play-btn");

      const bird = {
        x: canvas.width * 0.3,
        y: canvas.height * 0.5,
        radius: 12,
        velocity: 0,
      };

      const gravity = 1620;
      const flapStrength = -420;
      const pipeWidth = 62;
      const pipeGap = 150;
      const pipeSpacing = 200;
      const pipeSpeed = 144;
      const groundHeight = 80;
      const groundTileWidth = 40;
      const fixedTimeStep = 1 / 60;
      const maxFrameTime = 0.1;
      const pipeDespawnX = -pipeWidth;

      let pipes = [];
      let running = false;
      let gameOver = false;
      let score = 0;
      let bestScore = 0;
      let lastTime = 0;
      let accumulator = 0;
      let groundOffset = 0;

      function loadBestScore() {
        try {
          return Number(localStorage.getItem("flappyBest")) || 0;
        } catch {
          return 0;
        }
      }

      bestScore = loadBestScore();
      bestEl.textContent = bestScore.toString();

      function randomGapY() {
        const min = 80;
        const max = canvas.height - groundHeight - pipeGap - 80;
        return Math.random() * (max - min) + min;
      }

      function createPipe(x) {
        return { x, gapY: randomGapY(), scored: false };
      }

      function resetGame() {
        bird.y = canvas.height * 0.5;
        bird.velocity = 0;
        score = 0;
        accumulator = 0;
        lastTime = 0;
        pipes = [
          createPipe(canvas.width + 40),
          createPipe(canvas.width + 40 + pipeSpacing),
          createPipe(canvas.width + 40 + pipeSpacing * 2),
        ];
        gameOver = false;
        updateScore();
      }

      function updateScore() {
        scoreEl.textContent = score.toString();
        if (score > bestScore) {
          bestScore = score;
          bestEl.textContent = bestScore.toString();
          try {
            localStorage.setItem("flappyBest", bestScore.toString());
          } catch {
            // Ignore storage errors.
          }
        }
      }

      function startGame() {
        if (!running) {
          running = true;
        }
        overlay.classList.remove("show");
      }

      function endGame() {
        gameOver = true;
        overlayTitle.textContent = "Game Over";
        overlayMessage.textContent = "Tap or press Space to try again.";
        playButton.textContent = "Restart";
        overlay.classList.add("show");
      }

      function handleInput() {
        if (gameOver) {
          resetGame();
          startGame();
          return;
        }
        if (!running) {
          resetGame();
          startGame();
        }
        bird.velocity = flapStrength;
      }

      function update(deltaSeconds) {
        if (gameOver) return;
        bird.velocity += gravity * deltaSeconds;
        bird.y += bird.velocity * deltaSeconds;
        groundOffset = (groundOffset + pipeSpeed * deltaSeconds) % groundTileWidth;

        pipes.forEach((pipe) => {
          pipe.x -= pipeSpeed * deltaSeconds;
          if (!pipe.scored && pipe.x + pipeWidth < bird.x - bird.radius) {
            pipe.scored = true;
            score += 1;
            updateScore();
          }
        });

        if (pipes.length && pipes[0].x < pipeDespawnX) {
          pipes.shift();
          const lastX = pipes[pipes.length - 1].x;
          pipes.push(createPipe(lastX + pipeSpacing));
        }

        const ceiling = bird.radius;
        const floor = canvas.height - groundHeight - bird.radius;
        if (bird.y < ceiling || bird.y > floor) {
          bird.y = Math.min(Math.max(bird.y, ceiling), floor);
          endGame();
        }

        pipes.forEach((pipe) => {
          const pipeTop = pipe.gapY;
          const pipeBottom = pipe.gapY + pipeGap;
          const withinX = bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipeWidth;
          if (withinX && (bird.y - bird.radius < pipeTop || bird.y + bird.radius > pipeBottom)) {
            endGame();
          }
        });
      }

      function drawBackground() {
        ctx.fillStyle = "#86e1ff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff9c4";
        ctx.beginPath();
        ctx.arc(60, 60, 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#b3ecff";
        ctx.fillRect(0, canvas.height - groundHeight - 20, canvas.width, 20);
      }

      function drawPipes() {
        ctx.fillStyle = "#2ecc71";
        pipes.forEach((pipe) => {
          const topHeight = pipe.gapY;
          const bottomY = pipe.gapY + pipeGap;
          ctx.fillRect(pipe.x, 0, pipeWidth, topHeight);
          ctx.fillRect(pipe.x, bottomY, pipeWidth, canvas.height - groundHeight - bottomY);

          ctx.fillStyle = "#27ae60";
          ctx.fillRect(pipe.x - 4, topHeight - 16, pipeWidth + 8, 16);
          ctx.fillRect(pipe.x - 4, bottomY, pipeWidth + 8, 16);
          ctx.fillStyle = "#2ecc71";
        });
      }

      function drawGround() {
        ctx.fillStyle = "#ffcf6b";
        ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
        ctx.fillStyle = "#e2a94f";
        for (let x = -groundTileWidth + groundOffset; x < canvas.width; x += groundTileWidth) {
          ctx.fillRect(x, canvas.height - groundHeight + 10, 30, 12);
        }
      }

      function drawBird() {
        ctx.fillStyle = "#ff6b6b";
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#2d3436";
        ctx.beginPath();
        ctx.arc(bird.x + 4, bird.y - 4, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.moveTo(bird.x + 10, bird.y);
        ctx.lineTo(bird.x + 20, bird.y + 4);
        ctx.lineTo(bird.x + 10, bird.y + 8);
        ctx.closePath();
        ctx.fill();
      }

      function draw() {
        drawBackground();
        drawPipes();
        drawGround();
        drawBird();
      }

      function loop(timestamp) {
        if (!lastTime) {
          lastTime = timestamp;
        }
        const frameTime = Math.min((timestamp - lastTime) / 1000, maxFrameTime);
        lastTime = timestamp;

        if (running) {
          accumulator += frameTime;
          while (accumulator >= fixedTimeStep) {
            update(fixedTimeStep);
            accumulator -= fixedTimeStep;
          }
        }
        draw();
        requestAnimationFrame(loop);
      }

      playButton.addEventListener("click", handleInput);
      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          handleInput();
        } else if (event.code === "KeyR") {
          resetGame();
          startGame();
        }
      });

      canvas.addEventListener("pointerdown", handleInput);

      resetGame();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
